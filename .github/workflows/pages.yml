name: Publish dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Download official sources before publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      refresh_status: ${{ steps.refresh.outputs.status }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - run: echo "UK_FISCAL_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm test && npm run test:data
      - name: Refresh sources, retaining last good datasets on failure
        id: refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        shell: bash
        run: |
          set +e
          python -m pipeline.refresh
          uk=$?
          python -m pipeline.refresh --country au --group fiscal --group composition --group forecast --group curve --group outlook --group reliefs
          au=$?
          # AOFM blocks hosted runners, so Australian debt is refreshed from a local run; a failure here keeps
          # the last saved data and shows as stale on the site, but does not fail the refresh-health alarm.
          python -m pipeline.refresh --country au --group debt || echo "::notice::Australian debt not refreshed (AOFM blocks hosted runners); last saved data retained."
          python -m pipeline.refresh --country us
          us=$?
          set -e
          echo "status=$((uk || au || us))" >> "$GITHUB_OUTPUT"
      - name: Check GOV.UK for an OBR forecast newer than the pinned vintage
        if: steps.refresh.outcome != 'skipped'
        continue-on-error: true
        run: python -m pipeline.obr_check
      - run: python -m pipeline.refresh --validate && python -m pipeline.refresh --country au --validate && python -m pipeline.refresh --country us --validate
      - name: Preserve compact data vintages before deployment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin data-history
          git worktree add --detach .host-history FETCH_HEAD
          python -m pipeline.archive_history --destination .host-history --code-sha "$UK_FISCAL_CODE_SHA" --migrate-local
          git -C .host-history add releases metadata deployments latest.json
          if ! git -C .host-history diff --cached --quiet; then
            git -C .host-history commit -m 'Archive dashboard data vintage'
            git -C .host-history push origin HEAD:refs/heads/data-history
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          record=json.loads(Path('.host-history/latest.json').read_text())
          record['codeSha']=os.environ['UK_FISCAL_CODE_SHA']
          Path('public/deployment.json').write_text(json.dumps(record)+'\n')
          PY
          git add public/data public-au/data public-us/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official dashboard data'
            git push origin HEAD:main
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Test production app at its GitHub project path
        shell: bash
        run: |
          mkdir -p .preview/fiscal-space
          cp -R dist/. .preview/fiscal-space/
          python -m http.server 4173 --bind 127.0.0.1 --directory .preview &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          APP_URL=http://127.0.0.1:4173/fiscal-space/ npm run test:hosted
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  refresh-health:
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'success' && needs.build.outputs.refresh_status != '' && needs.build.outputs.refresh_status != '0'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Source refresh failed. Published validated retained data and the visible failure status; inspect the refresh log.'
          exit 1
